<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管综写作理由库 · 背诵卡</title>
<style>
:root{
  --bg:#f5f1e8; --bg-soft:#ece5d6; --surface:#fffdf8; --surface-2:#faf6ec;
  --ink:#27221a; --ink-2:#6c6354; --ink-3:#a89e8b; --line:#e5ddcc; --line-2:#f0eadb;
  --accent:#b5483c; --accent-soft:#f4e3de; --green:#3f826d; --green-soft:#e0ede7;
  --gold:#a9783f; --shadow:0 1px 2px rgba(46,38,24,.04),0 10px 30px rgba(46,38,24,.06);
  --shadow-lg:0 2px 6px rgba(46,38,24,.06),0 24px 60px rgba(46,38,24,.10);
  --serif:"Songti SC","Noto Serif SC","STSong","SimSun","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r:16px;
}
[data-theme="dark"]{
  --bg:#16130d; --bg-soft:#1f1a12; --surface:#211c14; --surface-2:#282218;
  --ink:#ece4d4; --ink-2:#b3a78f; --ink-3:#7f7461; --line:#342c1e; --line-2:#2c2519;
  --accent:#d47768; --accent-soft:#3a2520; --green:#78b69c; --green-soft:#203029;
  --gold:#c79a55; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
::selection{background:var(--accent);color:#fff}
.app{display:flex;height:100vh}
/* sidebar */
.sidebar{width:280px;flex:0 0 280px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 14px;gap:14px;overflow-y:auto;z-index:40}
.brand{padding:6px 8px 4px}
.brand h1{font-family:var(--serif);font-size:22px;letter-spacing:1px;font-weight:700;line-height:1.25}
.brand h1 .seal{color:var(--accent)}
.brand p{font-size:12px;color:var(--ink-3);margin-top:4px;letter-spacing:1px}
.search{position:relative}
.search input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:14px;outline:none;color:var(--ink);transition:border .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.nav{flex:1;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav-label{font-size:11px;color:var(--ink-3);letter-spacing:2px;padding:8px 10px 4px;font-weight:600}
.nav-item{border-radius:12px;transition:background .15s}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-soft)}
.nav-item.active .nav-name{color:var(--accent)}
.nav-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;width:100%;text-align:left}
.nav-row .ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--cat,#8a7a5f) 16%,transparent);color:var(--cat,var(--ink-2))}
.nav-row .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-name{flex:1;font-size:14px;font-weight:600;text-align:left}
.nav-count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.side-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.side-stat{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.side-stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn-reset{font-size:12px;color:var(--ink-3);padding:6px;border-radius:8px;transition:color .15s}
.btn-reset:hover{color:var(--accent);background:var(--accent-soft)}
/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:20px 28px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title-area h2{font-family:var(--serif);font-size:22px;letter-spacing:1px;font-weight:700}
.title-area p{font-size:13px;color:var(--ink-3);margin-top:3px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:7px 12px;font-size:13px;font-weight:600;border-radius:8px;color:var(--ink-2);transition:all .18s;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.select{padding:8px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:13px;outline:none;cursor:pointer;font-weight:500;color:var(--ink)}
.icon-toggle{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;transition:all .18s;color:var(--ink)}
.icon-toggle:hover{border-color:var(--accent);color:var(--accent)}
.icon-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.content{flex:1;overflow-y:auto;padding:14px 28px 60px}
/* section */
.section{margin-bottom:8px}
.section-head{display:flex;align-items:center;gap:12px;padding:18px 4px 12px}
.section-head .sq{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 36px;background:var(--cat,#c9b99a)}
.section-head .sq svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.section-head h3{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:1px}
.section-head .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.section-head .spacer{flex:1}
/* grid & card */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,opacity .2s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cat,#c9b99a);opacity:.9}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card.mastered{opacity:.84}
.card.mastered::after{content:"已掌握";position:absolute;top:12px;right:-34px;background:var(--green);color:#fff;font-size:11px;padding:4px 36px;transform:rotate(40deg);letter-spacing:1px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-title{display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:wrap}
.card-title h3{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:1px}
.cat-chip{font-size:11px;color:var(--cat,#8a7a5f);background:color-mix(in srgb,var(--cat,#8a7a5f) 12%,transparent);padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:600}
.card-actions{display:flex;gap:2px;flex:0 0 auto}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;color:var(--ink-3);transition:all .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.fav-on{color:var(--gold)}
.icon-btn.master-on{color:var(--green)}
.lvl{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:1px;white-space:nowrap}
.lvl0{color:var(--ink-3);background:var(--line-2)}.lvl1{color:var(--accent);background:var(--accent-soft)}
.lvl2{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}.lvl3{color:var(--green);background:var(--green-soft)}.lvl4{color:#fff;background:var(--green)}
/* para blocks */
.para{position:relative;margin:10px 0;padding:10px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line-2)}
.para .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:6px;margin-bottom:6px}
.tag-recall{color:var(--green);background:var(--green-soft)}
.tag-ref{color:var(--ink-2);background:var(--line-2)}
.ptext{font-family:var(--serif);font-size:15px;line-height:1.85;color:var(--ink);text-align:justify}
.ref-item{margin:8px 0;padding:8px 10px;border-radius:9px;background:var(--surface);border:1px dashed var(--line)}
.ref-item .rlabel{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--cat,#8a7a5f);display:block;margin-bottom:3px;letter-spacing:1px}
.ref-item .rtext{font-family:var(--serif);font-size:13.5px;line-height:1.75;color:var(--ink-2);text-align:justify}
.para[data-bt]{cursor:pointer}
.para.blurred .ptext{filter:blur(7px);user-select:none;pointer-events:none}
.reveal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;border-radius:11px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:1px}
.para.blurred .reveal{display:flex}
/* flashcard */
.flash-wrap{max-width:960px;margin:0 auto;padding:10px 0 40px}
.flash-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.flash-controls .pos{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.flash{perspective:1400px;cursor:pointer}
.flash-inner{position:relative;width:100%;min-height:440px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:34px 32px;display:flex;flex-direction:column}
.flash-back{transform:rotateY(180deg);overflow-y:auto}
.flash-cat{align-self:flex-start;font-size:12px;font-weight:600;color:var(--cat);background:color-mix(in srgb,var(--cat) 12%,transparent);padding:4px 12px;border-radius:99px;margin-bottom:auto}
.flash-word{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:2px;text-align:center;margin:24px 0 18px}
.flash-hint{margin-top:auto;text-align:center;font-size:12px;color:var(--ink-3);letter-spacing:2px}
.flash-actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:11px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);transition:all .18s;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost-green{color:var(--green);border-color:var(--green-soft);background:var(--green-soft)}
.btn.ghost-green:hover{border-color:var(--green)}
/* quiz */
.quiz-wrap{max-width:960px;margin:0 auto;padding:10px 0 40px}
.quiz-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:30px 30px 26px}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.quiz-word{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:2px}
.quiz-cat{font-size:12px;color:var(--ink-3);margin-top:2px}
.quiz-prompt{font-size:12px;color:var(--ink-3);letter-spacing:2px;font-weight:600;border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:14px}
.quiz-answer{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);min-height:120px;display:flex;flex-direction:column;gap:6px;justify-content:center;padding:14px}
.quiz-answer .ptext{filter:blur(8px);user-select:none}
.quiz-answer.revealed .ptext{filter:none}
.quiz-answer.revealed .blur-hint{display:none}
.blur-hint{font-size:13px;color:var(--ink-3);letter-spacing:1px;display:flex;align-items:center;gap:6px}
.quiz-actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.quiz-stats{display:flex;justify-content:center;gap:20px;margin-top:18px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.quiz-stats b{color:var(--green);font-variant-numeric:tabular-nums}
.empty{max-width:480px;margin:60px auto;text-align:center;color:var(--ink-3)}
.empty .big{font-size:44px;margin-bottom:14px}
.empty h3{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.7;margin-bottom:16px}
@media (max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .topbar{padding:16px 16px 10px}
  .content{padding:10px 16px 60px}
  .grid{grid-template-columns:1fr}
  .title-area h2{font-size:19px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>管综写作<span class="seal">·</span>理由库</h1>
      <p>角度分类 · 背诵卡</p>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索角度 / 关键词…">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-stat"><span>已掌握</span><b id="statMastered">0 / 19</b></div>
      <div class="side-stat"><span>已收藏</span><b id="statFavs">0</b></div>
      <button class="btn-reset" id="btnReset">清除全部学习进度</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="title-area">
        <h2 id="viewTitle">理由库</h2>
        <p id="viewSub">个人社会 6 角度 · 企业 6 功能 · 共 19 卡</p>
      </div>
      <div class="controls">
        <div class="seg" id="viewSeg">
          <button data-view="browse" class="on">浏览</button>
          <button data-view="flash">抽卡</button>
          <button data-view="quiz">默写</button>
        </div>
        <select class="select" id="blurSel">
          <option value="none">完整显示</option>
          <option value="recall">遮「核心话术」</option>
          <option value="all">遮全部</option>
        </select>
        <button class="icon-toggle" id="randomBtn" title="随机抽一条">
          <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M21 3l-7 7"/><path d="M8 21H3v-5"/><path d="M3 21l7-7"/><path d="M7.5 7.5l9 9"/></svg>
        </button>
        <button class="icon-toggle" id="themeBtn" title="切换主题">
          <svg id="themeIconSun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="21" y1="12" x2="19" y2="12"/><path d="M12 2a10 10 0 0 0 0 20z"/></svg>
          <svg id="themeIconMoon" viewBox="0 0 24 24" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal" id="randomModal" style="display:none">
  <div class="modal-backdrop" data-close="randomModal" style="position:fixed;inset:0;background:rgba(0,0,0,.45)"></div>
  <div class="modal-card" id="randomCard" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);max-width:560px;width:90%;max-height:86vh;overflow-y:auto;padding:26px;z-index:2"></div>
</div>

<script>
/* ================= 数据 ================= */
const IC = {
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  group:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  balance:'<line x1="3" y1="22" x2="21" y2="22"/><path d="M6 18V7h12v11"/><path d="M6 7l6-4 6 4"/><circle cx="9" cy="11" r="1.5"/><circle cx="15" cy="11" r="1.5"/>',
  bolt:'<path d="M13 2 3 14h7l-1 8 11-13h-7z"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  brief:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>'
};
const DATA = [
  {id:"jiazhi", name:"个人·价值认同", color:"#3f826d", icon:IC.user, words:[
    {id:"g-jiazhi", word:"① 对个人·价值认同（精神层面）",
     recall:"做 XX（符合主流价值观 / 发挥独特性 / 建立良好形象），获得社会认可、摆脱迷茫、收获尊重，实现自我价值认同。",
     refs:[
       {label:"10年 学者功利化", text:"无法沉下心来对自身研究领域进行研究，获得攻克学术难题后的成就感与满足感。当学术不端事件被揭露时，学者的个人声誉与学术公信力会瞬间崩塌，不仅会受到学术界的谴责与唾弃，更会让其在精神层面背负道德枷锁，最终失去作为科研工作者的核心价值认同。"},
       {label:"15年 为富不仁/为仁", text:"建立良好形象，获取社会认同，实现自我价值。（旁注：正面来写 为仁会如何 也是这两个角度；马斯洛需求层次理论）"},
       {label:"16年 多样一致·多样性", text:"每个人在兴趣、特长、思维模式上的独特性，让个体得以挣脱“同质化”的评价，多元个体的互动碰撞，能拓宽人的认知边界，让人学会尊重差异、包容不同，构建起更丰盈的精神世界，最终实现对自我价值的清晰认知与坚定认同"},
       {label:"16年 多样一致·一致性", text:"一致性的法律规范与共识价值观：对主流价值观的认同，能让个体摆脱价值认知的混乱与迷茫，个体树立正向的价值追求，在践行规范的过程中收获他人的尊重与认可，进而明晰自身存在的意义，实现自我价值发展"},
       {label:"25年 社会标准", text:"在现代社会形成发展到完善的几百年间，其内部形成的评价标准也越来越清晰，例如社会主流价值观、良好的社会道德规范，法律准则等，接受合理的评价标准，获取社会认可，有助于满足个体实现价值认同的需求，提升个人成就感和幸福感，进一步实现自我价值"}
     ]}
  ]},
  {id:"fazhan", name:"个人·发展", color:"#3f826d", icon:IC.user, words:[
    {id:"g-fazhan", word:"② 对个人·个人发展（务实层面）",
     recall:"做 XX，规避风险 / 降低成本、获得资源与机会、积累竞争力，稳步实现自身发展。",

/* ================= 渲染 ================= */
const content=$('#content');
function renderContent(){ if(state.view==='flash') return renderFlash(); if(state.view==='quiz') return renderQuiz(); renderBrowse(); }

function sectionHeader(cat){ return `<div class="section"><div class="section-head"><div class="sq" style="--cat:${cat.color}"><svg viewBox="0 0 24 24">${cat.icon}</svg></div><div><h3>${cat.name}</h3><div class="sub">${cat.words.length} 条</div></div></div></div>`; }

function refsHTML(w){
  if(!w.refs || !w.refs.length) return '';
  return w.refs.map(r=>`<div class="ref-item"><span class="rlabel" style="--cat:${w.category.color}">${esc(r.label)}</span><div class="rtext">${esc(r.text)}</div></div>`).join('');
}

function cardHTML(w){
  const cat=w.category, m=isMastered(w.id), f=state.favs.has(w.id), lvl=levelOf(w.id);
  return `<article class="card ${m?'mastered':''}" id="card-${w.id}" data-id="${w.id}" style="--cat:${cat.color}">
    <div class="card-head">
      <div class="card-title"><h3>${esc(w.word)}</h3><span class="cat-chip" style="--cat:${cat.color}">${cat.name}</span><span class="lvl lvl${lvl}">${LEVELS[lvl]}</span></div>
      <div class="card-actions">
        <button class="icon-btn ${f?'fav-on':''}" data-act="fav" data-id="${w.id}" title="收藏">★</button>
        <button class="icon-btn ${m?'master-on':''}" data-act="master" data-id="${w.id}" title="标记掌握">${m?'✓':'○'}</button>
      </div>
    </div>
    <div class="para" data-bt="recall">
      <span class="tag tag-recall">核心话术 · 背</span>
      <p class="ptext">${esc(w.recall)}</p>
      <button class="reveal">👁 点击显示</button>
    </div>
    ${w.refs && w.refs.length?`<div class="para"><span class="tag tag-ref">例句 / 参考</span>${refsHTML(w)}</div>`:''}
  </article>`;
}

function visibleWords(){
  let list=allWords();
  if(state.catId!=='all') list=list.filter(w=>w.category.id===state.catId);
  if(state.q){ const q=state.q.trim().toLowerCase(); if(q) list=list.filter(w=>w.word.toLowerCase().includes(q)||w.recall.includes(state.q.trim())||w.category.name.includes(state.q.trim())||(w.refs||[]).some(r=>r.text.includes(state.q.trim())||r.label.includes(state.q.trim()))); }
  return list;
}
function renderBrowse(){
  const list=visibleWords();
  if(!list.length){ content.innerHTML=`<div class="empty"><div class="big">🔍</div><h3>没有找到相关内容</h3><p>换个关键词试试。</p></div>`; return; }
  let html='';
  if(state.catId==='all' && !state.q){
    DATA.forEach(cat=>{ const ws=list.filter(w=>w.category.id===cat.id); if(!ws.length) return; html+=sectionHeader(cat)+`<div class="grid">${ws.map(cardHTML).join('')}</div>`; });
  } else if(state.catId==='all' && state.q){
    html+=`<div class="section-head"><div><h3>搜索结果</h3><div class="sub">${list.length} 条匹配</div></div></div><div class="grid">${list.map(cardHTML).join('')}</div>`;
  } else {
    const cat=DATA.find(c=>c.id===state.catId); html+=sectionHeader(cat)+`<div class="grid">${list.map(cardHTML).join('')}</div>`;
  }
  content.innerHTML=html; applyBlur();
}
function applyBlur(){ document.querySelectorAll('.para[data-bt]').forEach(p=>{ p.classList.toggle('blurred', state.blur==='all'||state.blur==='recall'); }); }

/* sidebar */
function renderSidebar(){
  const nav=$('#nav');
  let html=`<div class="nav-label">目录</div>`;
  html+=`<div class="nav-item ${state.catId==='all'?'active':''}"><button class="nav-row" data-cat="all"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="nav-name">全部理由</span><span class="nav-count">${masteredCount()}/${TOTAL}</span></button></div>`;
  DATA.forEach(cat=>{ const done=cat.words.filter(w=>isMastered(w.id)).length; html+=`<div class="nav-item ${state.catId===cat.id?'active':''}"><button class="nav-row" data-cat="${cat.id}"><span class="ic" style="--cat:${cat.color}"><svg viewBox="0 0 24 24">${cat.icon}</svg></span><span class="nav-name">${cat.name}</span><span class="nav-count">${done}/${cat.words.length}</span></button></div>`; });
  nav.innerHTML=html;
}
function updateStats(){ $('#statMastered').textContent=`${masteredCount()} / ${TOTAL}`; $('#statFavs').textContent=state.favs.size; }

/* 抽卡 */
function flashList(){ return state.catId==='all'? allWords() : allWords().filter(w=>w.category.id===state.catId); }
function renderFlash(){
  const l=flashList();
  if(!l.length){ content.innerHTML=`<div class="empty"><div class="big">🃏</div><h3>没有卡片</h3></div>`; return; }
  if(state.flashIndex>=l.length) state.flashIndex=0;
  const w=l[state.flashIndex], cat=w.category;
  content.innerHTML=`<div class="flash-wrap">
    <div class="flash-controls"><span class="pos">${state.flashIndex+1} / ${l.length}</span><span class="lvl lvl${levelOf(w.id)}">${LEVELS[levelOf(w.id)]}</span></div>
    <div class="flash ${state.flashFlipped?'flipped':''}" id="flashCard">
      <div class="flash-inner">
        <div class="flash-face flash-front">
          <div class="flash-cat" style="--cat:${cat.color}">${cat.name}</div>
          <div class="flash-word">${esc(w.word)}</div>
          <div class="flash-hint">点卡片翻面 · 回忆核心话术</div>
        </div>
        <div class="flash-face flash-back">
          <div class="flash-cat" style="--cat:${cat.color}">${cat.name}</div>
          <div class="flash-word" style="font-size:20px">${esc(w.word)}</div>
          <div class="para"><span class="tag tag-recall">核心话术 · 背</span><p class="ptext">${esc(w.recall)}</p></div>
          ${refsHTML(w)?`<div class="para"><span class="tag tag-ref">例句 / 参考</span>${refsHTML(w)}</div>`:''}
        </div>
      </div>
    </div>
    <div class="flash-actions">
      <button class="btn" data-fa="prev">← 上一张</button>
      <button class="btn primary" data-fa="flip">翻面</button>
      <button class="btn" data-fa="next">下一张 →</button>
      <button class="btn ${isMastered(w.id)?'ghost-green':''}" data-fa="master">${isMastered(w.id)?'✓ 已掌握':'○ 标记掌握'}</button>
      <button class="btn" data-fa="shuffle">🎲 随机</button>
    </div>
  </div>`;
}

/* 默写 */
function buildQuizDeck(){ state.quizDeck=shuffle(flashList()); state.quizIndex=0; state.quizRevealed=false; state.session={reviewed:0,mastered:0}; }
function renderQuiz(){
  if(!state.quizDeck.length) buildQuizDeck();
  const l=state.quizDeck;
  if(!l.length){ content.innerHTML=`<div class="empty"><div class="big">🎉</div><h3>全部掌握！</h3></div>`; return; }
  if(state.quizIndex>=l.length) state.quizIndex=0;
  const w=l[state.quizIndex], cat=w.category;
  content.innerHTML=`<div class="quiz-wrap"><div class="quiz-card">
    <div class="quiz-top"><div><div class="quiz-word">${esc(w.word)}</div><div class="quiz-cat">${cat.name}</div></div><span class="lvl lvl${levelOf(w.id)}">${LEVELS[levelOf(w.id)]}</span></div>
    <div class="quiz-prompt">第 ${state.quizIndex+1} / ${l.length} 题 · 回忆「核心话术」</div>
    <div class="quiz-answer ${state.quizRevealed?'revealed':''}">
      <span class="blur-hint">🔒 先在心里默背，再点「显示答案」核对</span>
      <p class="ptext">${esc(w.recall)}</p>
    </div>
    ${refsHTML(w)?`<div class="para"><span class="tag tag-ref">例句 / 参考</span>${refsHTML(w)}</div>`:''}
    <div class="quiz-actions">
      ${!state.quizRevealed?`<button class="btn primary" data-qa="reveal">显示答案</button>`:`<button class="btn ghost-green" data-qa="know">✔ 我会了</button><button class="btn" data-qa="again">✘ 还不会</button>`}
    </div>
  </div>
  <div class="quiz-stats"><span>本轮已复习 <b>${state.session.reviewed}</b></span><span>本轮已掌握 <b>${state.session.mastered}</b></span></div></div>`;
}

/* 随机 */
function pickRandom(){ const pool=allWords(); const w=pool[Math.floor(Math.random()*pool.length)]; const cat=w.category; $('#randomCard').innerHTML=`<button class="icon-btn" data-close="randomModal" style="position:absolute;top:12px;right:12px">✕</button><div style="margin-bottom:12px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap"><span class="cat-chip" style="--cat:${cat.color}">${cat.name}</span><span class="lvl lvl${levelOf(w.id)}">${LEVELS[levelOf(w.id)]}</span></div><div class="rm-word" style="font-family:var(--serif);font-size:22px;font-weight:700;text-align:center;margin:10px 0">${esc(w.word)}</div><div class="para"><span class="tag tag-recall">核心话术 · 背</span><p class="ptext">${esc(w.recall)}</p></div>${refsHTML(w)?`<div class="para"><span class="tag tag-ref">例句 / 参考</span>${refsHTML(w)}</div>`:''}`; $('#randomModal').style.display='flex'; }

/* 动作 */
function toggleFav(id){ if(state.favs.has(id)) state.favs.delete(id); else state.favs.add(id); persistFavs(); const b=document.querySelector(`[data-act="fav"][data-id="${id}"]`); if(b) b.classList.toggle('fav-on',state.favs.has(id)); updateStats(); }
function toggleMaster(id){ if(isMastered(id)) state.srs[id]={lvl:0}; else state.srs[id]={lvl:4}; persistSrs(); if(state.view==='browse') renderBrowse(); if(state.view==='flash') renderFlash(); renderSidebar(); updateStats(); }
function srsAnswer(id,ok){ const cur=levelOf(id); state.srs[id]={lvl:ok?Math.min(4,cur+1):Math.max(0,cur-1)}; persistSrs(); renderSidebar(); updateStats(); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function setView(v){ state.view=v; $('#viewSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.view===v)); const t={browse:['理由库','个人社会 6 角度 · 企业 6 功能 · 共 '+TOTAL+' 卡'],flash:['抽卡复习','翻面回忆核心话术'],quiz:['默写','遮住核心话术 · 先回忆再核对']}; $('#viewTitle').textContent=t[v][0]; $('#viewSub').textContent=t[v][1]; if(v==='quiz') buildQuizDeck(); if(v==='flash'){state.flashIndex=0;state.flashFlipped=false;} renderContent(); }
function setCat(id){ state.catId=id; if(state.view!=='browse') setView('browse'); else renderContent(); renderSidebar(); }
function toggleTheme(){ state.theme=state.theme==='light'?'dark':'light'; localStorage.setItem(LS+'_theme',state.theme); applyTheme(); }
function applyTheme(){ document.documentElement.setAttribute('data-theme',state.theme); $('#themeIconSun').style.display=state.theme==='dark'?'none':'block'; $('#themeIconMoon').style.display=state.theme==='dark'?'block':'none'; }

/* 事件 */
content.addEventListener('click', e=>{
  const reveal=e.target.closest('.reveal'); const para=e.target.closest('.para');
  if(para && para.classList.contains('blurred')){ para.classList.remove('blurred'); return; }
  const act=e.target.closest('[data-act]');
  if(act){ const id=act.dataset.id,a=act.dataset.act; if(a==='fav') toggleFav(id); else if(a==='master') toggleMaster(id); return; }
  const fa=e.target.closest('[data-fa]');
  if(fa){ const a=fa.dataset.fa, l=flashList();
    if(a==='flip'){ const c=$('#flashCard'); state.flashFlipped=!state.flashFlipped; if(c) c.classList.toggle('flipped',state.flashFlipped); }
    else if(a==='prev'){ state.flashIndex=(state.flashIndex-1+l.length)%l.length; state.flashFlipped=false; renderFlash(); }
    else if(a==='next'){ state.flashIndex=(state.flashIndex+1)%l.length; state.flashFlipped=false; renderFlash(); }
    else if(a==='shuffle'){ state.flashIndex=Math.floor(Math.random()*l.length); state.flashFlipped=false; renderFlash(); }
    else if(a==='master'){ const w=l[state.flashIndex]; if(w) toggleMaster(w.id); }
    return; }
  const qa=e.target.closest('[data-qa]');
  if(qa){ const a=qa.dataset.qa, w=state.quizDeck[state.quizIndex];
    if(a==='reveal'){ state.quizRevealed=true; renderQuiz(); }
    else if(a==='know'){ state.session.reviewed++; state.session.mastered++; if(w){ if(!isMastered(w.id)){state.srs[w.id]={lvl:4};persistSrs();renderSidebar();updateStats();} } state.quizIndex=(state.quizIndex+1)%state.quizDeck.length; state.quizRevealed=false; renderQuiz(); }
    else if(a==='again'){ state.session.reviewed++; state.quizIndex=(state.quizIndex+1)%state.quizDeck.length; state.quizRevealed=false; renderQuiz(); }
    return; }
  if(e.target.closest('#flashCard')){ state.flashFlipped=!state.flashFlipped; const c=$('#flashCard'); if(c) c.classList.toggle('flipped',state.flashFlipped); }
});
$('#viewSeg').addEventListener('click', e=>{ const b=e.target.closest('button[data-view]'); if(b) setView(b.dataset.view); });
$('#blurSel').addEventListener('change', e=>{ state.blur=e.target.value; applyBlur(); });
$('#searchInput').addEventListener('input', e=>{ state.q=e.target.value; if(state.view!=='browse') setView('browse'); else renderContent(); });
$('#nav').addEventListener('click', e=>{ const b=e.target.closest('[data-cat]'); if(b) setCat(b.dataset.cat); });
$('#themeBtn').addEventListener('click', toggleTheme);
$('#randomBtn').addEventListener('click', pickRandom);
document.addEventListener('click', e=>{ const c=e.target.closest('[data-close]'); if(c){ $('#randomModal').style.display='none'; } });
$('#btnReset').addEventListener('click', ()=>{ if(confirm('确定清除所有掌握、收藏记录吗？')){ state.srs={}; state.favs.clear(); persistSrs(); persistFavs(); renderSidebar(); updateStats(); renderContent(); } });
window.addEventListener('keydown', e=>{
  if(e.key==='Escape') $('#randomModal').style.display='none';
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(state.view==='flash'){ if(e.code==='Space'){e.preventDefault();const c=$('#flashCard');state.flashFlipped=!state.flashFlipped;if(c)c.classList.toggle('flipped',state.flashFlipped);} else if(e.code==='ArrowRight'){const l=flashList();state.flashIndex=(state.flashIndex+1)%l.length;state.flashFlipped=false;renderFlash();} else if(e.code==='ArrowLeft'){const l=flashList();state.flashIndex=(state.flashIndex-1+l.length)%l.length;state.flashFlipped=false;renderFlash();} }
  else if(state.view==='quiz'){ if(e.code==='Space'){e.preventDefault();if(!state.quizRevealed){state.quizRevealed=true;renderQuiz();}} }
});

/* 启动 */
applyTheme(); renderSidebar(); updateStats(); renderContent();
</script>
</body>
</html>
